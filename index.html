<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tenis interactivo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>🎯 Tiro al Blanco</h1>

    <div id="info">
        <div>Puntaje: <span id="score">0</span></div>
        <div>Tiempo: <span id="time">30</span>s</div>
    </div>

    <div id="resultOverlay">
        <div class="result-box">
            <h2>🏆 Fin del juego</h2>
            <p>Puntuación final</p>
            <div class="final-score" id="finalScore">0</div>
            <button onclick="startGame()">Jugar de nuevo</button>
        </div>
    </div>

    <div id="game"></div>
    <button id="startBtn" class="game-btn">Iniciar Juego</button>
    
    <script src="main.js"></script>
    

</body>
</html>
